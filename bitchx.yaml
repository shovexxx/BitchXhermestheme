# Hermes skin — "bitchx": classic BitchX IRC client, ANSI on black.
# Logo palette from the BitchX screenshot: magenta outline, green->cyan core,
# white dotted X on black, royal-blue status bar.
name: bitchx
description: BitchX IRC — classic black terminal, magenta outline, green-cyan logo core

colors:
  background: "#000000"

  ui_accent: "#00ff66"
  banner_accent: "#ff00ff"
  ui_tool: "#00ff66"

  banner_title: "#00ffff"
  banner_text: "#d0d0d0"
  ui_text: "#d0d0d0"
  ui_primary: "#ffffff"
  ui_label: "#d0d0d0"
  banner_dim: "#808080"
  banner_border: "#ff00ff"
  ui_border: "#9900cc"
  ui_thinking: "#808080"

  ui_ok: "#00ff66"
  ui_warn: "#ffff00"
  ui_error: "#ff0066"

  prompt: "#00ff00"
  input_rule: "#ff00ff"
  response_border: "#00ffff"
  status_bar_bg: "#0000cd"
  status_bar_text: "#ffffff"
  status_bar_good: "#00ff66"
  status_bar_warn: "#ffff00"
  status_bar_critical: "#ff0066"
  session_label: "#00ffff"
  session_border: "#9900cc"

  diff_added: "#00ff66"
  diff_removed: "#ff0066"
  diff_added_word: "#00ff66"
  diff_removed_word: "#ff0066"

  syntax_string: "#ffff00"
  syntax_number: "#ff00ff"
  syntax_keyword: "#00ffff"
  syntax_comment: "#808080"

  completion_menu_bg: "#000000"
  completion_menu_current_bg: "#002b2b"
  completion_menu_meta_bg: "#000000"

branding:
  agent_name: Hermes Agent
  prompt_symbol: ">"
  help_header: "BitchX commands"

tool_prefix: "|"
