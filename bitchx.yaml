# Hermes skin — "bitchx": classic BitchX IRC client, ANSI on black.
# Monospaced, black background, white/grey text, cyan/teal + magenta accents.
name: bitchx
description: BitchX IRC — classic black terminal, ANSI colours, cyan channels, magenta highlights

colors:
  background: "#000000"

  ui_accent: "#00c8c8"
  banner_accent: "#00c8c8"
  ui_tool: "#00c800"

  banner_title: "#ffffff"
  banner_text: "#c0c0c0"
  ui_text: "#c0c0c0"
  ui_primary: "#ffffff"
  ui_label: "#c0c0c0"
  banner_dim: "#808080"
  banner_border: "#008080"
  ui_border: "#005050"
  ui_thinking: "#808080"

  ui_ok: "#00c800"
  ui_warn: "#e0e000"
  ui_error: "#e00000"

  prompt: "#00c800"
  input_rule: "#008080"
  response_border: "#008080"
  status_bar_bg: "#0a0a0a"
  status_bar_text: "#c0c0c0"
  status_bar_good: "#00c800"
  status_bar_warn: "#e0e000"
  status_bar_critical: "#e00000"
  session_label: "#00c8c8"
  session_border: "#005050"

  diff_added: "#00c800"
  diff_removed: "#e00000"
  diff_added_word: "#00c800"
  diff_removed_word: "#e00000"

  syntax_string: "#e0e000"
  syntax_number: "#ff00ff"
  syntax_keyword: "#00c8c8"
  syntax_comment: "#808080"

  completion_menu_bg: "#000000"
  completion_menu_current_bg: "#003030"
  completion_menu_meta_bg: "#000000"

branding:
  agent_name: Hermes Agent
  prompt_symbol: ">"
  help_header: "BitchX commands"

tool_prefix: "|"
